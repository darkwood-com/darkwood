parameters:
    env(DARKWOOD_PASSWORDLESS_ENABLED): '0'

# Darkwood API action rate limiters (used in prod only by DarkwoodRateLimitSubscriber)
framework:
    rate_limiter:
        # Anonymous: 60 actions per hour
        darkwood_action_anonymous:
            policy: 'fixed_window'
            limit: 60
            interval: '1 hour'
        # Authenticated free users: higher limit
        darkwood_action_authenticated:
            policy: 'fixed_window'
            limit: 500
            interval: '1 hour'
        # Premium: effectively unlimited for MVP
        darkwood_action_premium:
            policy: 'fixed_window'
            limit: 10000
            interval: '1 hour'
        email_verification_ip:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        email_verification_address:
            policy: sliding_window
            limit: 1
            interval: '5 minutes'
        email_login_ip:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        email_login_address:
            policy: sliding_window
            limit: 2
            interval: '15 minutes'
