api_platform:
    mcp:
        # The public portal MCP uses explicit Symfony MCP handlers. API resources
        # (including the historical DarkwoodGame actions) must not be auto-exposed.
        enabled: false
        format: jsonld
    title: Darkwood API Platform
    version: 1.0.7
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']
    error_formats:
        jsonld: ['application/ld+json']
        json: ['application/problem+json']
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
        extra_properties:
            standard_put: true
    use_symfony_listeners: true
    swagger:
         api_keys:
             JWT:
                name: Authorization
                type: header
    serializer:
        hydra_prefix: false
    inflector: api_platform.metadata.inflector
