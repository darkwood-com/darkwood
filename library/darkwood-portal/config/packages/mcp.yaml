# MCP server — Symfony MCP Bundle 0.13+ (named servers)
# https://symfony.com/doc/current/ai/bundles/mcp-bundle.html
mcp:
    servers:
        default:
            transports:
                http: true
                stdio: false
            http:
                path: /mcp
                # Keep DNS rebinding protection; permit only the configured API host and loopback.
                allowed_hosts: ['%api_host%', localhost, 127.0.0.1]
            session:
                store: file
                directory: '%kernel.cache_dir%/mcp'
                ttl: 3600
            # Expose every registered MCP capability (API Platform tools, #[AsTool], …)
            registry: '*'
