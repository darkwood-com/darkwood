{{ $identity := .Site.Data.darkwood_identity }}
{{ $product := $identity.products.darkwood }}
{{ $locale := .Site.Language.Lang }}
<footer class="footer text-muted">
  <div class="container-xxl dw-product-footer">
    <div>
      <p class="mb-1">{{ .Site.Params.footer | safeHTML }}</p>
      <ul class="list-inline mb-0">
        {{ range .Site.Menus.footer }}
          <li class="list-inline-item"><a href="{{ .URL }}">{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </div>
    <div class="dw-identity">
      <a class="dw-identity__link" href="{{ index $identity.contact $locale | default $identity.contact.en }}">Contact</a>
      <a class="dw-identity__link" href="{{ index $identity.legal_mentions $locale | default $identity.legal_mentions.en }}">Legal mentions</a>
      <nav aria-label="Darkwood Identity" class="dw-identity__navigation">
        <ul class="dw-identity__products">
          <li><a class="dw-identity__link" href="{{ $product.url }}">
            <img src="{{ printf "darkwood/images/products/%s" $product.icon | relURL }}" width="24" height="24" alt="{{ $product.name }}">
          </a></li>
        </ul>
      </nav>
    </div>
  </div>
</footer>
