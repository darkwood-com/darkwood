name: Bug report
description: Report a bug in a Darkwood package or the monorepo
title: "[Bug]: "
labels:
  - bug
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - navi
        - flow
        - media-bundle
        - ia-exception-bundle
        - monorepo
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Darkwood version
      description: Unified version tag if known (e.g. 1.3.0)
      placeholder: 1.3.0
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP version, OS, relevant extensions
      placeholder: PHP 8.5, Ubuntu 24.04, ...
