name: Release check

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  qa:
    name: QA (all packages)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - navi
          - flow
          - media-bundle
          - ia-exception-bundle
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3311:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, iconv, xsl, openswoole
          tools: composer
          coverage: none

      - name: Run package QA
        run: .github/ci-run-package.sh "${{ matrix.package }}"
