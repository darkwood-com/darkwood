name: Release DarkwoodBundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Distribution tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: darkwood-bundle-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create distribution token
        id: distribution
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.DARKWOOD_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DARKWOOD_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: darkwood-com
          repositories: darkwood-bundle
          permission-contents: write
      - name: Push the exact bundle tree and tag
        env:
          VERSION: ${{ inputs.version }}
          DISTRIBUTION_TOKEN: ${{ steps.distribution.outputs.token }}
          DARKWOOD_BUNDLE_REMOTE: https://github.com/darkwood-com/darkwood-bundle.git
        run: |
          git -c credential.helper= config --local credential.helper '!f() { if [ "$1" = get ]; then printf "username=x-access-token\npassword=%s\n" "$DISTRIBUTION_TOKEN"; fi; }; f'
          bash .github/release-darkwood-bundle.sh "$VERSION" "$GITHUB_SHA"
