name: Publish static sites

on:
  push:
    branches: [main]
    paths:
      - .github/distribution-cards.json
      - library/darkwood-design/**
      - library/darkwood-php/src/Darkwood/Component/Navi/tools/env/shell.nix
      - library/content-darkwood-memory/**
      - library/content-darkwood-intent/**
      - library/content-darkwood-ai-mcp-symfony-hackathon/**
      - library/content-mario-orquestration/**
      - library/darkwood-php/src/Darkwood/Component/Flow/docs/**
      - .github/workflows/publish-github-pages.yml
  workflow_dispatch:
    inputs:
      target:
        description: Static site to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - darkwood-php-component-flow
          - content-darkwood-memory
          - content-darkwood-intent
          - content-darkwood-ai-mcp-symfony-hackathon
      dry_run:
        description: Build and compare without pushing
        required: true
        default: true
        type: boolean

concurrency:
  group: static-sites-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Read the canonical distribution manifest
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Check out the publication manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/distribution-cards.json
            .github/scripts/validate-publication-domains.mjs
            .github/scripts/validate-publication-domains.test.mjs

      - name: Set up Node.js for hostname validation
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"

      - name: Validate publication hostnames
        run: |
          node --test .github/scripts/validate-publication-domains.test.mjs
          node .github/scripts/validate-publication-domains.mjs

      - name: Build the Pages matrix
        id: matrix
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          value=$(jq -c --arg requested "$REQUESTED_TARGET" '{include: [.cards[] | select(
            .pages != null and
            ($requested == "" or $requested == "all" or .id == $requested)
          ) | {
            id,
            source: .pages.source,
            artifact: .pages.artifact,
            repository: .pages.repository,
            owner: (.pages.repository | split("/")[0]),
            repository_name: (.pages.repository | split("/")[1]),
            domain: .pages.domain,
            builder: .pages.builder,
            node_test: (.pages.nodeTest // "")
          }]}' .github/distribution-cards.json)
          echo "value=$value" >> "$GITHUB_OUTPUT"

  publish:
    name: ${{ matrix.id }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out the canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            ${{ matrix.source }}
            library/darkwood-design
            library/darkwood-php/src/Darkwood/Component/Navi/tools/env/shell.nix
            ${{ matrix.id == 'content-darkwood-ai-mcp-symfony-hackathon' && 'library/content-mario-orquestration' || '' }}
            .github/distribution-cards.json
            .github/workflows/publish-github-pages.yml
          sparse-checkout-cone-mode: false

      - name: Select the changed site
        id: select
        env:
          BEFORE: ${{ github.event.before }}
          CURRENT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target }}
          SOURCE: ${{ matrix.source }}
          TARGET: ${{ matrix.id }}
        run: |
          selected=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_TARGET" == "all" || "$REQUESTED_TARGET" == "$TARGET" ]]; then
              selected=true
            fi
          elif [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            selected=true
          elif git diff --quiet "$BEFORE" "$CURRENT" -- "$SOURCE" library/darkwood-design .github/distribution-cards.json .github/workflows/publish-github-pages.yml; then
            selected=false
          else
            selected=true
          fi
          if [[ "$EVENT_NAME" == "push" && "$TARGET" == "content-darkwood-ai-mcp-symfony-hackathon" ]] &&
             ! git diff --quiet "$BEFORE" "$CURRENT" -- library/content-mario-orquestration; then
            selected=true
          fi
          if [[ "$EVENT_NAME" == "push" && ( "$TARGET" == "content-darkwood-memory" || "$TARGET" == "content-darkwood-intent" || "$TARGET" == "content-darkwood-ai-mcp-symfony-hackathon" ) ]] &&
             ! git diff --quiet "$BEFORE" "$CURRENT" -- library/darkwood-php/src/Darkwood/Component/Navi/tools/env/shell.nix; then
            selected=true
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for static sites
        if: steps.select.outputs.selected == 'true' && matrix.builder == 'node'
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "22"

      - name: Build and validate the Node static site
        if: steps.select.outputs.selected == 'true' && matrix.builder == 'node'
        working-directory: ${{ matrix.source }}
        env:
          ARTIFACT_DIRECTORY: ${{ github.workspace }}/${{ matrix.artifact }}
          DOMAIN: ${{ matrix.domain }}
        run: |
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
            npm run build
          else
            node build.mjs
            node validate.mjs
          fi
          test -s "$ARTIFACT_DIRECTORY/index.html"
          test "$(cat "$ARTIFACT_DIRECTORY/CNAME")" = "$DOMAIN"

      - name: Set up Nix for PHP static sites and the executable candidate
        if: steps.select.outputs.selected == 'true' && (matrix.builder == 'nix' || matrix.id == 'content-darkwood-ai-mcp-symfony-hackathon')
        uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31

      - name: Verify the executable hackathon candidate without provider access
        if: steps.select.outputs.selected == 'true' && matrix.id == 'content-darkwood-ai-mcp-symfony-hackathon'
        working-directory: library/content-mario-orquestration
        run: |
          nix develop -c composer install --no-scripts --no-interaction --prefer-dist --no-progress
          nix develop -c composer validate --no-check-publish
          nix develop -c composer check-platform-reqs
          nix develop -c php tests/generation-regression.php
          nix develop -c php tests/design-regression.php

      - name: Test and export the PHP static site
        if: steps.select.outputs.selected == 'true' && matrix.builder == 'nix'
        working-directory: ${{ matrix.source }}
        env:
          ARTIFACT_DIRECTORY: ${{ github.workspace }}/${{ matrix.artifact }}
        run: |
          nix develop -c composer install --no-interaction --prefer-dist --no-progress
          nix develop -c php bin/console lint:twig templates
          nix develop -c php bin/phpunit
          nix develop -c node --test "tests/${{ matrix.node_test }}.test.mjs"
          nix develop -c php bin/console app:export-static
          test -s "$ARTIFACT_DIRECTORY/index.html"

      - name: Create a repository-scoped publication token
        if: steps.select.outputs.selected == 'true'
        id: publication-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DARKWOOD_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DARKWOOD_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repository_name }}
          permission-contents: write

      - name: Publish the generated site
        if: steps.select.outputs.selected == 'true'
        id: publish
        env:
          ARTIFACT: ${{ matrix.artifact }}
          CANONICAL_SHA: ${{ github.sha }}
          DOMAIN: ${{ matrix.domain }}
          REPOSITORY: ${{ matrix.repository }}
          TARGET: ${{ matrix.id }}
          APP_TOKEN: ${{ steps.publication-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone "https://github.com/$REPOSITORY.git" pages
          if git -C pages show-ref --verify --quiet refs/heads/gh-pages; then
            git -C pages switch gh-pages
          elif git -C pages show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git -C pages switch --create gh-pages --track origin/gh-pages
          else
            git -C pages switch --orphan gh-pages
          fi

          rsync -a --delete --exclude='.git/' "$ARTIFACT/" pages/
          printf '%s\n' "$DOMAIN" > pages/CNAME
          touch pages/.nojekyll
          git -C pages add --all

          if git -C pages diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C pages diff --cached --stat
          git -C pages config user.name github-actions[bot]
          git -C pages config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C pages commit -m "📚 Publish $TARGET from darkwood@${CANONICAL_SHA:0:12}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "Dry run requested; generated commit was not pushed."
            exit 0
          fi
          git -C pages push origin HEAD:gh-pages
