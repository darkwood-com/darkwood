name: Sync distribution mirrors

on:
  push:
    branches: [main]
    paths:
      - .github/distribution-cards.json
      - .github/workflows/sync-distribution-mirrors.yml
      - .github/workflows/publish-distribution-mirror.yml
      - .github/scripts/php-quality-matrix.php
      - library/.github/**
      - library/matyo91/**
      - library/darkwood-php/src/Darkwood/Component/Flow/**
      - library/darkwood-php/src/Darkwood/Component/Navi/**
      - library/darkwood-php/src/Darkwood/Bundle/MediaBundle/**
      - library/darkwood-php/src/Darkwood/Bundle/IaExceptionBundle/**
      - library/darkwood-php/src/Darkwood/Bundle/DarkwoodBundle/**
  workflow_dispatch:
    inputs:
      target:
        description: Distribution mirror to synchronize
        required: true
        default: all
        type: choice
        options:
          - all
          - organization-profile
          - personal-profile
          - darkwood-php-component-flow
          - darkwood-php-component-navi
          - darkwood-php-bundle-darkwood-media-bundle
          - darkwood-php-bundle-darkwood-ia-exception-bundle
          - darkwood-php-bundle-darkwood-bundle
      dry_run:
        description: Validate and show the diff without pushing
        required: true
        default: true
        type: boolean

concurrency:
  group: distribution-mirrors-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Select mirrors from the canonical distribution manifest
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - id: matrix
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
          BEFORE: ${{ github.event.before }}
        run: |
          quality=$(php .github/scripts/php-quality-matrix.php)
          changed=''
          if [[ "$GITHUB_EVENT_NAME" == push && -n "$BEFORE" && ! "$BEFORE" =~ ^0+$ ]]; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          value=$(jq -c --arg requested "$REQUESTED_TARGET" --arg changed "$changed" --argjson quality "$quality" '
            ($changed | split("\n")) as $files
            | {include: [.cards[] | select(.git != null) | . as $entry
            | select(
                if $requested != "" then ($requested == "all" or .id == $requested)
                else $changed == "" or any($files[]; startswith($entry.source + "/")
                  or . == ".github/distribution-cards.json"
                  or . == ".github/scripts/php-quality-matrix.php"
                  or . == ".github/workflows/publish-distribution-mirror.yml"
                  or . == ".github/workflows/sync-distribution-mirrors.yml")
                end)
            | {
                id,
                source,
                repository,
                owner: (.repository | split("/")[0]),
                repository_name: (.repository | split("/")[1]),
                branch: .git.branch,
                bootstrap_branch: (.git.bootstrapBranch // ""),
                composer: (.git.composer // ""),
                requires_php: (.git.composer != null),
                quality: ([$quality.include[] | select(.directory == $entry.source)] | first // {})
              }]}' .github/distribution-cards.json)
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<< "$value")" >> "$GITHUB_OUTPUT"

  sync:
    name: ${{ matrix.id }}
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/publish-distribution-mirror.yml
    with:
      mirror: ${{ toJSON(matrix) }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    secrets:
      DARKWOOD_DISTRIBUTION_APP_PRIVATE_KEY: ${{ secrets.DARKWOOD_DISTRIBUTION_APP_PRIVATE_KEY }}
