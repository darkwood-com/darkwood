name: Sync distribution mirrors

on:
  push:
    branches: [main]
    paths:
      - .github/distribution-cards.json
      - .github/workflows/sync-distribution-mirrors.yml
      - library/.github/**
      - library/matyo91/**
      - library/darkwood-php/src/Darkwood/Component/Flow/**
      - library/darkwood-php/src/Darkwood/Component/Navi/**
      - library/darkwood-php/src/Darkwood/Bundle/MediaBundle/**
      - library/darkwood-php/src/Darkwood/Bundle/IaExceptionBundle/**
  workflow_dispatch:
    inputs:
      target:
        description: Distribution mirror to synchronize
        required: true
        default: all
        type: choice
        options:
          - all
          - organization-profile
          - personal-profile
          - darkwood-php-component-flow
          - darkwood-php-component-navi
          - darkwood-php-bundle-media
          - darkwood-php-bundle-ia-exception
      dry_run:
        description: Validate and show the diff without pushing
        required: true
        default: true
        type: boolean

concurrency:
  group: distribution-mirrors-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Read the canonical distribution manifest
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Check out the publication manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/distribution-cards.json

      - name: Build the Git distribution matrix
        id: matrix
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          value=$(jq -c --arg requested "$REQUESTED_TARGET" '{include: [.cards[] | select(
            .git != null and
            ($requested == "" or $requested == "all" or .id == $requested)
          ) | {
            id,
            source,
            repository,
            owner: (.repository | split("/")[0]),
            repository_name: (.repository | split("/")[1]),
            branch: .git.branch,
            bootstrap_branch: (.git.bootstrapBranch // ""),
            composer: (.git.composer // ""),
            package_id: (.git.packageId // ""),
            php_version: (.git.phpVersion // "8.6"),
            php_extensions: (.git.phpExtensions // ""),
            mysql: (.git.mysql // false)
          }]}' .github/distribution-cards.json)
          echo "value=$value" >> "$GITHUB_OUTPUT"

  sync:
    name: ${{ matrix.id }}
    needs: prepare
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: ${{ matrix.mysql && 'mysql:5.7' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3311:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out the canonical monorepo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            ${{ matrix.source }}
            library/darkwood-php/.github
            library/darkwood-php/src/Darkwood/Component/Navi/tools/env
            .github/distribution-cards.json
            .github/workflows/sync-distribution-mirrors.yml
          sparse-checkout-cone-mode: false

      - name: Select changed mirror
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CURRENT: ${{ github.sha }}
          REQUESTED_TARGET: ${{ inputs.target }}
          SOURCE: ${{ matrix.source }}
          TARGET: ${{ matrix.id }}
        run: |
          selected=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$REQUESTED_TARGET" == "all" || "$REQUESTED_TARGET" == "$TARGET" ]]; then
              selected=true
            fi
          elif git diff --name-only "$BEFORE" "$CURRENT" -- \
            "$SOURCE" .github/distribution-cards.json .github/workflows/sync-distribution-mirrors.yml | grep -q .; then
            selected=true
          fi
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

      - name: Set up PHP
        if: steps.select.outputs.selected == 'true' && matrix.composer != '' && matrix.php_version != '8.6'
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: ${{ matrix.php_extensions }}
          tools: composer, symfony-cli
          coverage: none

      - name: Validate Composer package
        if: steps.select.outputs.selected == 'true' && matrix.composer != '' && matrix.php_version != '8.6'
        env:
          SOURCE: ${{ matrix.source }}
          EXPECTED_PACKAGE: ${{ matrix.composer }}
          PACKAGE_ID: ${{ matrix.package_id }}
          # Symfony CLI uses this short-lived token to resolve/download Language Tools.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # shellcheck disable=SC2016
          actual_package=$(php -r 'echo json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR)["name"];' "$SOURCE/composer.json")
          test "$actual_package" = "$EXPECTED_PACKAGE"
          composer validate --strict --no-check-publish "$SOURCE/composer.json"
          library/darkwood-php/.github/ci-run-package.sh "$PACKAGE_ID"

      - name: Set up Nix for PHP 8.6
        if: steps.select.outputs.selected == 'true' && matrix.php_version == '8.6'
        uses: cachix/install-nix-action@d9186cbdca7adedf113a159fa91f725a27866771 # v31

      - name: Validate package on stable PHP 8.6
        if: steps.select.outputs.selected == 'true' && matrix.php_version == '8.6'
        working-directory: ${{ matrix.source }}
        env:
          EXPECTED_PACKAGE: ${{ matrix.composer }}
          PACKAGE_ID: ${{ matrix.package_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$PACKAGE_ID" in
            flow)
              shell_args=(--argstr naviEnv "$(cd ../Navi/tools/env && pwd -P)" --arg withOpenSwoole true)
              ;;
            navi)
              shell_args=(--argstr lockFile "$PWD/tools/env/flake.lock" --arg withQualityTools true
                --arg extraExtensions '{ all, ... }: [ all.openswoole ]')
              ;;
            *)
              echo "No pinned PHP 8.6 shell configured for $PACKAGE_ID" >&2
              exit 1
              ;;
          esac
          nix --extra-experimental-features 'nix-command flakes' develop --file tools/env/shell.nix \
            "${shell_args[@]}" -c bash -euo pipefail -c '
              test "$(jq -r .name composer.json)" = "$EXPECTED_PACKAGE"
              php -v
              composer install --no-progress --no-interaction
              composer validate --strict --no-check-publish
              composer check-platform-reqs
              composer -d tools/phpstan install --no-progress --no-interaction
              composer -d tools/phpunit install --no-progress --no-interaction
              # PHP CS Fixer 3.95.32 does not support PHP 8.6 syntax.
              phpstan analyse -c tools/phpstan/phpstan.neon --memory-limit=1024M \
                --autoload-file tools/phpunit/vendor/autoload.php
              phpunit -c tools/phpunit/phpunit.dist.xml
              # Run Symfony project diagnostics when Navi ships an application entry point.
              if [[ "$PACKAGE_ID" == navi && -f bin/console ]]; then
                tools/symfony-lsp/check.sh github
              fi
            '

      - name: Create a repository-scoped publication token
        if: steps.select.outputs.selected == 'true'
        id: publication-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.DARKWOOD_DISTRIBUTION_APP_ID }}
          private-key: ${{ secrets.DARKWOOD_DISTRIBUTION_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}
          repositories: ${{ matrix.repository_name }}
          permission-contents: write

      - name: Build mirror commit
        if: steps.select.outputs.selected == 'true'
        id: mirror
        env:
          SOURCE: ${{ matrix.source }}
          REPOSITORY: ${{ matrix.repository }}
          BRANCH: ${{ matrix.branch }}
          BOOTSTRAP_BRANCH: ${{ matrix.bootstrap_branch }}
          TARGET: ${{ matrix.id }}
          CANONICAL_SHA: ${{ github.sha }}
          APP_TOKEN: ${{ steps.publication-token.outputs.token }}
        run: |
          git config --global url."https://x-access-token:${APP_TOKEN}@github.com/".insteadOf "https://github.com/"
          mirror_url="https://github.com/$REPOSITORY.git"
          clone_branch="$BRANCH"
          if [[ -n "$BOOTSTRAP_BRANCH" ]]; then
            status=0
            git ls-remote --exit-code --heads "$mirror_url" "refs/heads/$BRANCH" >/dev/null || status=$?
            if [[ "$status" == 2 ]]; then
              clone_branch="$BOOTSTRAP_BRANCH"
            elif [[ "$status" != 0 ]]; then
              exit "$status"
            fi
          fi
          git clone --branch "$clone_branch" --single-branch "$mirror_url" mirror
          staging=$(mktemp -d)
          git archive "$CANONICAL_SHA:$SOURCE" | tar -x -C "$staging"
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            "$staging/" mirror/
          rm -rf "$staging"

          rm -rf mirror/.github/workflows
          cat > mirror/DISTRIBUTION_MIRROR.md <<EOF
          # Distribution mirror

          This repository is a read-only distribution mirror. Development, issues, and pull requests belong in the [canonical Darkwood monorepo](https://github.com/darkwood-com/darkwood/tree/main/$SOURCE).

          Canonical source: \`$SOURCE\`<br>
          Canonical revision: \`$CANONICAL_SHA\`
          EOF

          cat > mirror/.darkwood-mirror.json <<EOF
          {
            "canonical_repository": "darkwood-com/darkwood",
            "canonical_path": "$SOURCE",
            "canonical_revision": "$CANONICAL_SHA",
            "destination_repository": "$REPOSITORY",
            "destination_branch": "$BRANCH"
          }
          EOF

          git -C mirror add --all
          if git -C mirror diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git -C mirror diff --cached --stat
          git -C mirror config user.name github-actions[bot]
          git -C mirror config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C mirror commit -m "🔄 Sync $TARGET from darkwood@${CANONICAL_SHA:0:12}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push mirror commit
        if: >-
          steps.select.outputs.selected == 'true' &&
          steps.mirror.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run == false)
        env:
          BRANCH: ${{ matrix.branch }}
        run: |
          git -C mirror push origin "HEAD:refs/heads/$BRANCH"

      - name: Report dry run
        if: >-
          steps.select.outputs.selected == 'true' &&
          steps.mirror.outputs.changed == 'true' &&
          github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        run: echo "Validated ${{ matrix.id }}; dry run requested, nothing was pushed."

